services:
  pownforge:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    # archlinux:base has no arm64 manifest; force amd64 (QEMU-emulated on
    # Apple Silicon hosts) so the build resolves everywhere consistently.
    platform: linux/amd64
    volumes:
      - ./config:/app/config
      - ./.pownforge:/app/.pownforge
    working_dir: /app
    networks:
      - pownforge-lab
      - kind

networks:
  pownforge-lab:
    # `pownforge lab add` が `docker network create --internal` で作成する
    # 隔離ネットワークです。compose 側では作成せず既存のものを参照します。
    # 先に `pownforge lab add <name> --image <image>` を一度実行してから
    # `docker compose up` / `docker compose run` してください。
    external: true
    name: pownforge-lab
  kind:
    # `kind create cluster` が作成する既定のDockerネットワークです。ここに
    # 参加することで、`kubernetes`プラグイン(trivy k8s)がkindクラスタの
    # APIサーバー(コンテナ名:6443)へ到達できます。`pownforge-lab`とは異なり
    # `--internal`ではない(kindノードがイメージ取得等で外部到達を必要と
    # するため)ので、このネットワーク経由では外部への到達も可能になる点に
    # 注意してください(docs/handbook.md §7参照)。先に対象のkindクラスタを
    # 一度作成してから`docker compose up` / `docker compose run`してください。
    external: true
    name: kind
