[project]
name = "pownforge"
version = "0.1.0"
description = "A modular security assessment CLI for local labs and authorized engagements."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
pownforge = "pownforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pownforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
