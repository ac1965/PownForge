[project]
name = "pownforge"
version = "0.1.0"
description = "A modular security assessment CLI for local labs and authorized engagements."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pypdf>=4.0",  # tests/test_reporting_pdf.py extracts text to assert on
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # multipart form parsing for POST /api/runs/import uploads
]
pdf = [
    "reportlab>=4.0",
]

[project.scripts]
pownforge = "pownforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pownforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# examples/ are separate packages with their own tests (need `pip install -e` first).
testpaths = ["tests"]
