[project]
name = "pownforge-plugin-example"
version = "0.1.0"
description = "Example external PownForge plugin: records an HTML page's <title>."
requires-python = ">=3.11"
dependencies = ["pownforge"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# The registry discovers plugins through this entry point group.
[project.entry-points."pownforge.plugins"]
http-title = "pownforge_plugin_example:HttpTitlePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pownforge_plugin_example"]
